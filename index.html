<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nexus AI</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="app">

    <!-- ========================= -->
    <!-- Sidebar -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div>

            <div class="logo">

                <div class="logo-circle">
                    N
                </div>

                <div class="logo-text">

                    <h2>Nexus AI</h2>

                    <p>Version 4.0</p>

                </div>

            </div>

            <button class="new-chat" id="newChat">

                ＋ New Chat

            </button>

            <div class="history">

                <h3>Recent Chats</h3>

                <div class="chat-item active">

                    Welcome

                </div>

                <div class="chat-item">

                    Portfolio Website

                </div>

                <div class="chat-item">

                    Python Help

                </div>

            </div>

        </div>

        <div class="sidebar-bottom">

            <button class="sidebar-btn">

                ⚙ Settings

            </button>

            <button class="sidebar-btn">

                👤 Profile

            </button>

        </div>

    </aside>

    <!-- ========================= -->
    <!-- Main -->
    <!-- ========================= -->

    <main class="main">

        <header class="top-bar">

            <div>

                <h2>Nexus AI</h2>

                <small>GPT-4.1 mini</small>

            </div>

            <div class="top-buttons">

                <button id="clearChat">

                    🗑

                </button>

            </div>

        </header>

        <section
            class="chat-area"
            id="chatArea">

            <div class="message ai">

                <div class="avatar">

                    N

                </div>

                <div class="bubble">

                    <h4>Nexus</h4>

                    <p>

                        Hello David 👋

                    </p>

                    <p>

                        I'm Nexus AI.

                    </p>

                    <p>

                        What are we building today?

                    </p>

                </div>

            </div>

        </section>

        <div
            class="typing"
            id="typing">

            <span></span>

            <span></span>

            <span></span>

        </div>

        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Message Nexus AI...">

            <button id="sendButton">

                ➜

            </button>

        </div>

    </main>

</div>

<script src="script.js"></script>

</body>

</html>
